name: Scheduled Opportunity Expiry

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  expiry:
    runs-on: ubuntu-latest
    # Disabled until the deployment endpoint and both GitHub settings are
    # deliberately configured by the deployment owner.
    if: ${{ vars.OPPORTUNITY_EXPIRY_ENABLED == 'true' }}
    concurrency:
      group: opportunity-expiry
      cancel-in-progress: false
    steps:
      - name: Validate endpoint configuration
        env:
          OPPORTUNITY_EXPIRY_URL: ${{ vars.OPPORTUNITY_EXPIRY_URL }}
          OPPORTUNITY_EXPIRY_SECRET: ${{ secrets.OPPORTUNITY_EXPIRY_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$OPPORTUNITY_EXPIRY_URL" || "$OPPORTUNITY_EXPIRY_URL" != https://* ]]; then
            echo "OPPORTUNITY_EXPIRY_URL must be a configured HTTPS deployment URL" >&2
            exit 1
          fi
          if [[ -z "$OPPORTUNITY_EXPIRY_SECRET" || ${#OPPORTUNITY_EXPIRY_SECRET} -lt 32 ]]; then
            echo "OPPORTUNITY_EXPIRY_SECRET must be configured with at least 32 characters" >&2
            exit 1
          fi
      - name: Expire due opportunities
        env:
          OPPORTUNITY_EXPIRY_URL: ${{ vars.OPPORTUNITY_EXPIRY_URL }}
          OPPORTUNITY_EXPIRY_SECRET: ${{ secrets.OPPORTUNITY_EXPIRY_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${OPPORTUNITY_EXPIRY_SECRET}" \
            -H "Content-Type: application/json" \
            "${OPPORTUNITY_EXPIRY_URL%/}/api/maintenance/opportunities/expire")
          printf '%s\n' "$response"
          printf '%s' "$response" | jq -e '.expiredCount | numbers and . >= 0' >/dev/null
