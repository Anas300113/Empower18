name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap disposable RLS test database
        run: pnpm test:rls:bootstrap
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Apply checked-in migrations to disposable test database
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Grant test role table privileges
        run: pnpm test:rls:grant
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - run: pnpm check
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - run: pnpm build
      - run: git diff --check
